name: ui-check

on:
  push:
    branches: [master]
    paths:
      - "index.html"
      - "audit.js"
      - "audit.py"
      - "audit_request.py"
      - "data/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ui-check.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:ui
        env:
          UI_BROWSERS: chromium,firefox,webkit

      - run: python -m pip install --quiet -r requirements-dev.txt
      - run: python -m pytest -q
