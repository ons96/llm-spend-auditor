name: refresh-data

on:
  schedule:
    # Weekly, Monday 06:17 UTC. Off the hour to avoid the busiest runner window.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements-dev.txt

      - name: Scrape Artificial Analysis
        # Refuses to write under 50 parsed rows, so a redesign fails loudly.
        run: python scrape_aa.py

      - name: Rebuild the price table
        run: python etl.py --refresh

      - name: Export the UI dataset
        run: python audit.py --export

      - name: Test before committing
        run: python -m pytest -q

      - name: Commit if the data moved
        run: |
          if git diff --quiet -- data/aa_scores.json data/prices.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aa_scores.json data/prices.json
          git commit -m "chore: refresh AA scores and prices"
          git push
